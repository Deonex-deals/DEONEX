{% extends "base.html" %}

{% block title %}Contact | Deonex Deals{% endblock %}

{% block content %}
<section class="page-banner">
  <div class="container">
    <span class="eyebrow">GET IN TOUCH</span>
    <h1>Contact Deonex Deals</h1>
    <p>Business inquiry, partnership या website question के लिए message भेजें.</p>
  </div>
</section>

<section class="container section form-section">
  <form class="premium-form" method="POST">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
      </div>
    </div>

    <div class="form-group">
      <label for="subject">Subject</label>
      <input id="subject" name="subject" type="text" placeholder="How can we help?" required>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>
    </div>

    <button class="btn btn-primary" type="submit">Send message</button>
  </form>
</section>
{% endblock %}
