{% extends "base.html" %}

{% block title %}Feedback | Deonex Deals{% endblock %}

{% block content %}
<section class="page-banner">
  <div class="container">
    <span class="eyebrow">YOUR VOICE MATTERS</span>
    <h1>Share your feedback</h1>
    <p>आपका feedback Deonex Deals को बेहतर बनाने में मदद करता है.</p>
  </div>
</section>

<section class="container section form-section">
  <form class="premium-form" method="POST">
    <div class="form-row">
      <div class="form-group">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" placeholder="Your full name" required>
      </div>
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>
      </div>
    </div>

    <div class="form-group">
      <label for="rating">Your rating</label>
      <select id="rating" name="rating" required>
        <option value="">Choose a rating</option>
        <option value="5">5 - Excellent</option>
        <option value="4">4 - Very good</option>
        <option value="3">3 - Good</option>
        <option value="2">2 - Needs improvement</option>
        <option value="1">1 - Poor</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Feedback</label>
      <textarea id="message" name="message" rows="6" placeholder="Tell us about your experience..." required></textarea>
    </div>

    <button class="btn btn-primary" type="submit">Submit feedback</button>
  </form>
</section>
{% endblock %}
