services:
  - type: web
    name: deonex-deals
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  - type: cron
    name: deonex-amazon-sync
    runtime: python
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m services.import_amazon
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: AMAZON_API_URL
        sync: false
      - key: AMAZON_API_KEY
        sync: false

  - type: cron
    name: deonex-flipkart-sync
    runtime: python
    schedule: "0 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m services.import_flipkart
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FLIPKART_API_URL
        sync: false
      - key: FLIPKART_API_KEY
        sync: false

  - type: cron
    name: deonex-cuelinks-sync
    runtime: python
    schedule: "0 0,12 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m services.import_cuelinks
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CUELINKS_API_URL
        sync: false
      - key: CUELINKS_API_KEY
        sync: false